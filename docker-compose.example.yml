# Example deployment: cp docker-compose.example.yml docker-compose.yml, fill in .env, `docker compose up -d`
services:
  app:
    image: ghcr.io/OWNER/REPO:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    # app + multiplayer (/colyseus) – put a TLS reverse proxy in front for https / wss
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  db:
